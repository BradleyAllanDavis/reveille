name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      # The eval gate: regenerate the scorecard over fixture briefings and
      # fail on any regression vs the committed baseline.
      - run: uv run reveille evals
