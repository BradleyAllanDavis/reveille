[project]
name = "reveille"
version = "0.1.0"
description = "Multi-agent morning-briefing coordinator with a regression-runnable evals harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
reveille = "reveille.cli:main"

[dependency-groups]
dev = [
    # starlette.testclient (used by tests/test_api.py) prefers httpx2 over
    # httpx and warns on every run if it's absent -- this isn't a stray
    # import, it's what silences that deprecation warning.
    "httpx2>=2.12.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reveille"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
